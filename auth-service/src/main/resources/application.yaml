spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5454}/microservicesDB
    username: ${DB_USER:postgres}
    password: ${DB_PASS:12345678}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all #Продюсер ждет подтверждения принятия сообщений всех реплик, кто был в коннекте
    properties:
      request.timeout.ms: 2000
      default.api.timeout.ms: 3000
      max.block.ms: 2000
      reconnect.backoff.ms: 500
      reconnect.backoff.max.ms: 2000



grpc:
  client:
    user-service:
      address: ${GRPC_USER_SERVICE_ADDRESS:static://localhost:9090}
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

logging:
  level:
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
    org.springframework.jdbc: DEBUG
    ru.microservices.user_service.grpc: DEBUG


server:
  port: 8091
