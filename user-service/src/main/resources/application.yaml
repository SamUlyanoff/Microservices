spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5454}/microservicesDB
    username: ${DB_USER:postgres}
    password: ${DB_PASS:12345678}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: public

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:29093}
    consumer:
      group-id: userService
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "ru.microservices.common_events.*"
    listener:
      missing-topics-fatal: false

grpc:
  server:
    port: 9090
    address: 0.0.0.0

logging:
  level:
    liquibase: DEBUG
    org.springframework.boot.autoconfigure.liquibase: DEBUG
    org.springframework.jdbc: DEBUG
    ru.microservices.user_service.grpc: DEBUG
#    org.apache.kafka: DEBUG
#    org.springframework.kafka: DEBUG
#    org.apache.kafka.clients.consumer: DEBUG

server:
  port: 8096